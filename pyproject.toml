[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-agent"
version = "0.1.0"
description = "Conversational Claude agent over AI usage & cost data in Microsoft Fabric (Power BI semantic model + Fabric SQL)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "azure-identity>=1.17",
    "pandas>=2.1",
    "sqlalchemy>=2.0",
    "pyodbc>=5.1",
    "python-dotenv>=1.0",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
usage-agent = "usage_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
