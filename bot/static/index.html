<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>AI Usage Agent</title>

  <style>
    :root {
      color-scheme: light;
      font-family:
        Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f8;
      color: #172033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #e8efff 0, transparent 35%),
        #f4f6f8;
    }

    .app {
      width: min(1280px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      box-shadow: 0 0 30px rgba(20, 37, 63, 0.08);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid #dde3ec;
      background: #ffffff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #234b8f;
      color: white;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .title {
      margin: 0;
      font-size: 1.1rem;
    }

    .subtitle {
      margin: 3px 0 0;
      color: #667085;
      font-size: 0.85rem;
    }

    button {
      font: inherit;
    }

    .reset-button {
      border: 1px solid #ccd4df;
      border-radius: 8px;
      padding: 8px 13px;
      background: #ffffff;
      color: #344054;
      cursor: pointer;
    }

    .reset-button:hover {
      background: #f7f9fc;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-chip {
      font-size: 0.8rem;
      color: #4a5568;
      background: #eef2f7;
      border: 1px solid #dde3ec;
      border-radius: 999px;
      padding: 5px 11px;
      white-space: nowrap;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
    }

    .message-row {
      display: flex;
      margin-bottom: 18px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant,
    .message-row.error {
      justify-content: flex-start;
    }

    .message {
      max-width: min(1040px, 92%);
      padding: 13px 16px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-row.user .message {
      background: #234b8f;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-row.assistant .message {
      background: #eef2f7;
      color: #172033;
      border-bottom-left-radius: 4px;
      white-space: normal;
    }

    .message h1,
    .message h2,
    .message h3 {
      margin: 14px 0 8px;
      line-height: 1.25;
    }

    .message h1:first-child,
    .message h2:first-child,
    .message h3:first-child {
      margin-top: 0;
    }

    .message p {
      margin: 8px 0;
    }

    .message ul,
    .message ol {
      margin: 8px 0;
      padding-left: 24px;
    }

    .message table {
      display: block;
      width: 100%;
      margin: 12px 0;
      overflow-x: auto;
      border-collapse: collapse;
      background: #ffffff;
    }

    .message th,
    .message td {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      text-align: left;
      white-space: nowrap;
    }

    .message th {
      background: #e2e8f0;
      font-weight: 600;
    }

    .message code {
      padding: 2px 5px;
      border-radius: 4px;
      background: #dde5ef;
      font-family: Consolas, "Courier New", monospace;
    }

    .message pre {
      overflow-x: auto;
      padding: 12px;
      border-radius: 8px;
      background: #172033;
      color: #f8fafc;
    }

    .message pre code {
      padding: 0;
      background: transparent;
      color: inherit;
    }

    .message-row.error .message {
      background: #fff1f0;
      color: #9f1c14;
      border: 1px solid #ffc9c5;
    }

    .starter-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 4px 0 24px;
    }

    .starter {
      border: 1px solid #b9c8df;
      border-radius: 999px;
      padding: 8px 13px;
      background: #ffffff;
      color: #234b8f;
      cursor: pointer;
    }

    .starter:hover {
      background: #eef4ff;
    }

    .status {
      min-height: 24px;
      padding: 0 24px;
      color: #667085;
      font-size: 0.85rem;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      padding: 16px 24px 22px;
      border-top: 1px solid #dde3ec;
      background: #ffffff;
    }

    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 160px;
      resize: vertical;
      border: 1px solid #b8c2d1;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      line-height: 1.4;
      color: #172033;
      outline: none;
    }

    textarea:focus {
      border-color: #3569ba;
      box-shadow: 0 0 0 3px rgba(53, 105, 186, 0.14);
    }

    .send-button {
      min-width: 86px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 11px 18px;
      background: #234b8f;
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
    }

    .send-button:hover {
      background: #193d79;
    }

    .send-button:disabled,
    .reset-button:disabled,
    textarea:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    @media (max-width: 600px) {
      .header,
      .messages,
      .composer {
        padding-left: 14px;
        padding-right: 14px;
      }

      .subtitle {
        display: none;
      }

      .message {
        max-width: 94%;
      }

      .send-button {
        min-width: 70px;
        padding-left: 12px;
        padding-right: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">AI</div>

        <div>
          <h1 class="title">AI Usage Agent</h1>
          <p class="subtitle">
            Ask questions about AI usage and cost
          </p>
        </div>
      </div>

      <div class="header-right">
        <span id="userChip" class="user-chip" hidden></span>
        <button
          id="resetButton"
          class="reset-button"
          type="button"
        >
          New chat
        </button>
      </div>
    </header>

    <section
      id="messages"
      class="messages"
      aria-live="polite"
      aria-label="Conversation"
    >
      <div class="message-row assistant">
        <div class="message">
Hi! I can answer questions about AI usage and cost. What would you like to know?
        </div>
      </div>

      <div id="starters" class="starter-grid">
        <button class="starter" type="button">
          How much did we spend last week?
        </button>

        <button class="starter" type="button">
          Show spend by provider last week
        </button>

        <button class="starter" type="button">
          Who were the top 10 spenders last week?
        </button>
      </div>
    </section>

    <div id="status" class="status" role="status"></div>

    <form id="composer" class="composer">
      <textarea
        id="messageInput"
        placeholder="Ask a question…"
        aria-label="Message"
        rows="1"
        required
      ></textarea>

      <button
        id="sendButton"
        class="send-button"
        type="submit"
      >
        Send
      </button>
    </form>
  </main>

  <script src="/static/marked.min.js"></script>
  <script src="/static/purify.min.js"></script>


  <script>
    const messages = document.getElementById("messages");
    const composer = document.getElementById("composer");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const resetButton = document.getElementById("resetButton");
    const status = document.getElementById("status");
    const starters = document.getElementById("starters");

    let sessionId =
      window.localStorage.getItem("usageAgentSessionId") || "";

    let busy = false;

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(text, role) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "message";

      // Render assistant Markdown, then sanitize the generated HTML. Keep user
      // and error messages as text so they can never inject markup.
      if (
        role === "assistant" &&
        window.marked &&
        window.DOMPurify
      ) {
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        bubble.textContent = text;
      }

      row.appendChild(bubble);
      messages.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function setBusy(isBusy) {
      busy = isBusy;
      messageInput.disabled = isBusy;
      sendButton.disabled = isBusy;
      resetButton.disabled = isBusy;

      status.textContent = isBusy
        ? "Checking the data…"
        : "";

      if (!isBusy) {
        messageInput.focus();
      }
    }

    function renderAssistant(bubble, text) {
      if (window.marked && window.DOMPurify) {
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        bubble.textContent = text;
      }
    }

    // Stream the answer over Server-Sent Events. A failure to *open* the stream
    // throws (so the caller falls back to /api/chat); a failure mid-stream is
    // shown in place, so we never end up with a duplicate reply bubble.
    async function streamMessage(text) {
      let response;
      try {
        response = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, sessionId: sessionId })
        });
      } catch (e) {
        throw new Error("stream-unavailable");
      }
      if (!response.ok || !response.body) {
        throw new Error("stream-unavailable");
      }

      const bubble = addMessage("", "assistant");
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let answer = "";

      try {
        while (true) {
          const chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });

          let sep;
          while ((sep = buffer.indexOf("\n\n")) !== -1) {
            const frame = buffer.slice(0, sep);
            buffer = buffer.slice(sep + 2);

            const dataLine = frame
              .split("\n")
              .find((l) => l.startsWith("data:"));
            if (!dataLine) continue;

            let ev;
            try {
              ev = JSON.parse(dataLine.slice(5).trim());
            } catch (e) {
              continue;
            }

            if (ev.type === "text") {
              answer += ev.text;
              bubble.classList.remove("error");
              bubble.textContent = answer; // raw while streaming; Markdown at the end
              scrollToBottom();
            } else if (ev.type === "tool") {
              // Text before a tool call was preamble — drop it, show progress.
              answer = "";
              bubble.textContent = "Looking at the data…";
              scrollToBottom();
            } else if (ev.type === "error") {
              bubble.classList.add("error");
              bubble.textContent = ev.text || "Something went wrong.";
            } else if (ev.type === "done") {
              if (ev.sessionId) {
                sessionId = ev.sessionId;
                window.localStorage.setItem("usageAgentSessionId", sessionId);
              }
            }
          }
        }

        if (!bubble.classList.contains("error")) {
          renderAssistant(bubble, answer || "(no answer returned)");
          scrollToBottom();
        }
      } catch (e) {
        bubble.classList.add("error");
        bubble.textContent = "The connection was interrupted. Please try again.";
      }
    }

    // Non-streaming fallback (used if the SSE stream can't be opened).
    async function sendViaJson(text) {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, sessionId: sessionId })
      });
      const result = await response.json();
      if (result.sessionId) {
        sessionId = result.sessionId;
        window.localStorage.setItem("usageAgentSessionId", sessionId);
      }
      if (!response.ok) {
        throw new Error(result.error || `Request failed (${response.status})`);
      }
      addMessage(result.answer, "assistant");
    }

    async function sendMessage(text) {
      const trimmed = text.trim();

      if (!trimmed || busy) {
        return;
      }

      if (starters) {
        starters.remove();
      }

      addMessage(trimmed, "user");
      messageInput.value = "";
      setBusy(true);

      try {
        await streamMessage(trimmed);
      } catch (error) {
        try {
          await sendViaJson(trimmed);
        } catch (error2) {
          addMessage(
            (error2 && error2.message) || "The request could not be completed.",
            "error"
          );
        }
      } finally {
        setBusy(false);
      }
    }

    composer.addEventListener("submit", async (event) => {
      event.preventDefault();
      await sendMessage(messageInput.value);
    });

    messageInput.addEventListener("keydown", async (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        await sendMessage(messageInput.value);
      }
    });

    document.querySelectorAll(".starter").forEach((button) => {
      button.addEventListener("click", async () => {
        await sendMessage(button.textContent);
      });
    });

    resetButton.addEventListener("click", async () => {
      if (busy) {
        return;
      }

      setBusy(true);

      try {
        await fetch("/api/chat/reset", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            sessionId: sessionId
          })
        });
      } finally {
        sessionId = "";
        window.localStorage.removeItem("usageAgentSessionId");

        messages.replaceChildren();

        addMessage(
          "Conversation cleared. What would you like to know?",
          "assistant"
        );

        setBusy(false);
      }
    });

    // Show the signed-in user (from Azure Easy Auth) if present. Locally this is
    // empty unless DEV_AUTH_USER is set on the server — then the chip appears.
    async function loadUser() {
      try {
        const res = await fetch("/api/me");
        const data = await res.json();
        if (data && data.user) {
          const chip = document.getElementById("userChip");
          chip.textContent = "Signed in as " + data.user;
          chip.hidden = false;
        }
      } catch (e) {
        /* no auth layer (e.g. local) — leave the chip hidden */
      }
    }

    loadUser();
    messageInput.focus();
  </script>
</body>
</html>
